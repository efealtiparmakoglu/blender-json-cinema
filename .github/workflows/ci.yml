name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate scene examples and camera mathematics
        run: python tests/verify.py
      - name: Validate CLI and fail-fast scene checks (no Blender required)
        run: python -m unittest discover -s tests -p test_scene_config.py -v
      - name: Check public validation command and syntax
        run: |
          python generator.py --check
          python -m py_compile generator.py scene_config.py cam_path.py
